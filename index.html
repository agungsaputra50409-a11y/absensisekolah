
<script>
(function () {
'use strict';

const $ = id => document.getElementById(id);

const video = $('video');
const statusBox = $('status');
const resultBox = $('result');
const camera = $('camera');

const params = new URLSearchParams(location.search);
const returnOrigin = params.get('returnOrigin') || '';
const nonce = params.get('nonce') || '';

let reader = null;
let controls = null;
let devices = [];
let facing = 'environment';
let running = false;
let delivering = false;
let lastCode = '';
let lastTime = 0;

let audioCtx = null;
let lastAudioAt = 0;

// ===============================
// STATUS DAN KOMUNIKASI
// ===============================

function say(message) {
  statusBox.textContent = message;
}

function post(type, data = {}) {
  if (!window.opener || window.opener.closed || !returnOrigin) {
    return false;
  }

  try {
    window.opener.postMessage(
      { ...data, type, nonce },
      returnOrigin
    );
    return true;
  } catch (error) {
    return false;
  }
}

// ===============================
// IZIN DAN DAFTAR KAMERA
// ===============================

async function enumerateCameras() {
  try {
    devices = (await navigator.mediaDevices.enumerateDevices())
      .filter(device => device.kind === 'videoinput');
  } catch (error) {
    devices = [];
  }

  const oldValue = camera.value;

  camera.innerHTML =
    '<option value="">Pilih kamera (otomatis)</option>';

  devices.forEach((device, index) => {
    const option = document.createElement('option');

    option.value = device.deviceId;
    option.textContent =
      device.label || `Kamera ${index + 1}`;

    camera.appendChild(option);
  });

  if (oldValue && devices.some(d => d.deviceId === oldValue)) {
    camera.value = oldValue;
  }
}

// ===============================
// PESAN KESALAHAN KAMERA
// ===============================

function friendly(error) {
  const name = error?.name || '';

  if (name === 'NotAllowedError' ||
      name === 'PermissionDeniedError') {
    return 'Izin kamera ditolak. Izinkan akses kamera pada pengaturan browser.';
  }

  if (name === 'NotFoundError' ||
      name === 'DevicesNotFoundError') {
    return 'Kamera tidak ditemukan pada perangkat.';
  }

  if (name === 'NotReadableError' ||
      name === 'TrackStartError') {
    return 'Kamera sedang digunakan aplikasi lain. Tutup aplikasi tersebut.';
  }

  if (name === 'OverconstrainedError' ||
      name === 'ConstraintNotSatisfiedError') {
    return 'Kamera pilihan tidak tersedia. Pilih kamera lainnya.';
  }

  if (!window.isSecureContext) {
    return 'Scanner harus dibuka melalui HTTPS.';
  }

  return error?.message || 'Kamera gagal dibuka. Periksa izin kamera.';
}

// ===============================
// AUDIO DAN SUARA ABSENSI
// ===============================

async function primeAudio() {
  try {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) return;

    if (!audioCtx) {
      audioCtx = new AudioContextClass();
    }

    if (audioCtx.state === 'suspended') {
      await audioCtx.resume();
    }
  } catch (error) {
    console.log('Audio:', error);
  }
}

function beep(success) {
  try {
    if (!audioCtx) return;

    const frequencies = success
      ? [880, 1175, 1568]
      : [440, 330];

    frequencies.forEach((frequency, index) => {
      const start = audioCtx.currentTime + index * 0.15;

      const oscillator = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(frequency, start);

      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.2, start + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.16);

      oscillator.connect(gain);
      gain.connect(audioCtx.destination);

      oscillator.start(start);
      oscillator.stop(start + 0.18);
    });
  } catch (error) {
    console.log('Beep:', error);
  }
}

function announceAttendance(success, message) {
  const now = Date.now();

  if (now - lastAudioAt < 900) return;

  lastAudioAt = now;
  beep(success);

  if ('speechSynthesis' in window) {
    try {
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(
        success ? 'Absensi berhasil' : (message || 'Absensi gagal')
      );

      utterance.lang = 'id-ID';
      utterance.rate = 0.92;
      utterance.pitch = success ? 1.05 : 0.9;
      utterance.volume = 1;

      window.speechSynthesis.speak(utterance);
    } catch (error) {
      console.log('Speech:', error);
    }
  }
}

// ===============================
// STOP KAMERA
// ===============================

function stop() {
  running = false;
  delivering = false;

  try {
    if (controls) {
      controls.stop();
      controls = null;
    }
  } catch (error) {
    console.log('Stop scanner:', error);
  }

  try {
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(track => track.stop());
      video.srcObject = null;
    }

    video.pause();
  } catch (error) {
    console.log('Stop video:', error);
  }
}

// ===============================
// PROSES QR
// ===============================

function deliver(code) {
  const now = Date.now();

  code = String(code || '').trim();

  if (!code) return;

  if (code === lastCode && now - lastTime < 2500) {
    return;
  }

  if (delivering) return;

  lastCode = code;
  lastTime = now;
  delivering = true;

  resultBox.textContent = 'QR: ' + code;
  say('QR terbaca. Mengirim ke ABSENSIQR...');

  const sent = post('ABSENSIQR_QR_SCAN', {
    code: code,
    scanId: (nonce || 'scan') + ':' + now
  });

  if (!sent) {
    say('QR terbaca, tetapi ABSENSIQR tidak terhubung.');
    resultBox.textContent =
      'GAGAL TERHUBUNG: Buka scanner melalui aplikasi ABSENSIQR.';

    delivering = false;
    return;
  }

  try {
    navigator.vibrate?.(80);
  } catch (error) {}

  setTimeout(() => {
    if (delivering) {
      say('Menunggu konfirmasi dari ABSENSIQR...');
      resultBox.textContent =
        'QR terkirim. Menunggu konfirmasi database.';
      delivering = false;
    }
  }, 12000);
}

// ===============================
// MEMULAI KAMERA DAN SCANNER
// ===============================

async function startCamera() {
  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {
    throw new Error(
      'Kamera membutuhkan HTTPS dan browser yang mendukung getUserMedia.'
    );
  }

  if (!window.ZXingBrowser ||
      !ZXingBrowser.BrowserQRCodeReader) {
    throw new Error(
      'Library QR gagal dimuat. Periksa koneksi internet.'
    );
  }

  stop();

  say('Meminta izin kamera...');

  reader = new ZXingBrowser.BrowserQRCodeReader();

  const callback = (qr, error) => {
    if (!running) return;

    if (qr) {
      deliver(qr.getText());
    }
  };

  try {
    if (camera.value) {
      controls = await reader.decodeFromVideoDevice(
        camera.value,
        video,
        callback
      );
    } else {
      controls = await reader.decodeFromConstraints(
        {
          audio: false,
          video: {
            facingMode: { ideal: facing },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        },
        video,
        callback
      );
    }

    running = true;

    await enumerateCameras();

    const stream = video.srcObject;
    const track = stream?.getVideoTracks?.()[0];
    const settings = track?.getSettings?.() || {};

    if (settings.deviceId) {
      camera.value = settings.deviceId;
    }

    say('✓ Kamera aktif. Arahkan QR ke dalam kotak.');
    resultBox.textContent = 'Kamera aktif. Menunggu QR...';

    post('ABSENSIQR_SCANNER_STATUS', {
      status: 'Kamera aktif',
      facing: settings.facingMode || facing
    });

  } catch (error) {
    stop();
    throw error;
  }
}

// ===============================
// GANTI KAMERA DEPAN / BELAKANG
// ===============================

async function flipCamera() {
  facing = facing === 'environment'
    ? 'user'
    : 'environment';

  camera.value = '';

  try {
    await startCamera();
  } catch (error) {
    say('✕ ' + friendly(error));

    post('ABSENSIQR_SCANNER_ERROR', {
      message: friendly(error)
    });
  }
}

// ===============================
// TOMBOL
// ===============================

$('start').addEventListener('click', async () => {
  await primeAudio();

  try {
    await startCamera();
  } catch (error) {
    say('✕ ' + friendly(error));

    post('ABSENSIQR_SCANNER_ERROR', {
      message: friendly(error)
    });
  }
});

$('stop').addEventListener('click', () => {
  stop();

  say('Kamera dihentikan.');
  resultBox.textContent = 'Scanner tidak aktif.';

  post('ABSENSIQR_SCANNER_STATUS', {
    status: 'Kamera dihentikan'
  });
});

$('flip').addEventListener('click', flipCamera);

$('back').addEventListener('click', () => {
  stop();

  post('ABSENSIQR_SCANNER_CLOSE', {});

  say('Kembali ke ABSENSIQR...');

  setTimeout(() => {
    try {
      window.close();
    } catch (error) {}
  }, 100);
});

camera.addEventListener('change', async () => {
  if (!camera.value) return;

  try {
    await startCamera();
  } catch (error) {
    say('✕ ' + friendly(error));
  }
});

$('soundTest').addEventListener('click', async () => {
  await primeAudio();

  beep(true);

  if ('speechSynthesis' in window) {
    const speech = new SpeechSynthesisUtterance(
      'Absensi berhasil'
    );
    speech.lang = 'id-ID';
    window.speechSynthesis.speak(speech);
  }

  say('Tes suara berhasil dijalankan.');
});

// ===============================
// SCAN QR DARI FOTO
// ===============================

$('photo').addEventListener('click', () => {
  $('file').click();
});

$('file').addEventListener('change', async event => {
  const file = event.target.files?.[0];

  if (!file) return;

  let url = null;

  try {
    say('Membaca QR dari foto...');

    if (!window.ZXingBrowser) {
      throw new Error('Library QR belum dimuat.');
    }

    url = URL.createObjectURL(file);

    const image = new Image();

    image.onload = async () => {
      try {
        const imageReader =
          new ZXingBrowser.BrowserQRCodeReader();

        const qr = await imageReader.decodeFromImageElement(image);

        deliver(qr.getText());

      } catch (error) {
        say('QR tidak ditemukan. Gunakan foto yang lebih jelas.');
      } finally {
        URL.revokeObjectURL(url);
        $('file').value = '';
      }
    };

    image.onerror = () => {
      URL.revokeObjectURL(url);
      $('file').value = '';
      say('Foto tidak dapat dibaca.');
    };

    image.src = url;

  } catch (error) {
    if (url) URL.revokeObjectURL(url);

    $('file').value = '';
    say(error.message || 'Gagal membaca foto.');
  }
});

// ===============================
// MENERIMA KONFIRMASI ABSENSI
// ===============================

window.addEventListener('message', event => {
  if (returnOrigin && event.origin !== returnOrigin) {
    return;
  }

  const data = event.data || {};

  if (nonce && data.nonce !== nonce) {
    return;
  }

  if (data.type === 'ABSENSIQR_STOP_SCANNER') {
    stop();
    say('Scanner dihentikan oleh ABSENSIQR.');
  }

  if (data.type === 'ABSENSIQR_SCAN_RESULT') {
    delivering = false;

    const success =
      data.ok === true ||
      data.success === true ||
      ['success', 'berhasil'].includes(
        String(data.status || data.result || '').toLowerCase()
      );

    if (success) {
      say('✓ Absensi berhasil disimpan.');

      resultBox.textContent =
        'TERSIMPAN: ' +
        (data.name || data.message || 'Absensi siswa berhasil.');

      announceAttendance(true);

    } else {
      const message =
        data.message || data.error || 'Absensi gagal disimpan.';

      say('✕ Absensi gagal.');

      resultBox.textContent = 'GAGAL: ' + message;

      announceAttendance(false, message);
    }
  }
});

// ===============================
// SAAT HALAMAN DIBUKA
// ===============================

window.addEventListener('load', async () => {
  await enumerateCameras();

  say('Scanner siap. Tekan Mulai Kamera.');

  // Percobaan otomatis. Jika browser memerlukan interaksi,
  // pengguna masih bisa menekan tombol Mulai Kamera.
  try {
    await startCamera();
  } catch (error) {
    say('✕ ' + friendly(error) +
      ' Tekan Mulai Kamera untuk mencoba kembali.');
  }
});

window.addEventListener('pagehide', stop);

})();
</script>
